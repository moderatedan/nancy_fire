# Refreshes data/trades.json weekly from public STOCK Act disclosures,
# commits the change, and lets GitHub Pages redeploy the dashboard.
name: Update disclosure data

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest disclosures
        run: python3 fetch_trades.py --member "Pelosi"

      - name: Commit if changed
        run: |
          git config user.name "nancy-fire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trades.json
          git diff --cached --quiet && echo "No new filings." && exit 0
          git commit -m "data: refresh disclosures ($(date -u +%F))"
          git push
